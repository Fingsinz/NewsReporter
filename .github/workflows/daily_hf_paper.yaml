name: Analyze HuggingFace Daily Papers

on:
  schedule:
    - cron: '0 18 * * *' # every day at UTC+8 18:00
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: | 
          uv venv
          uv sync

      - name: Run HF Paper Daily Analysis
        run: |
          uv run python -m scripts.run_hf_paper_daily \
            "${{ secrets.RSS_BASE_URL }}" \
            "${{ secrets.MODEL_API_KEY }}"
          uv run python -m scripts.run_homepage

      - name: Commit generated files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git checkout -b gh-pages
          git add docs/
          git diff --staged --quiet || git commit -m "docs: update daily HF papers report"
          git push

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/
          publish_branch: gh-pages
          force_orphan: true
          keep_files: true
