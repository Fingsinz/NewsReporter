name: Analyze HuggingFace Daily Papers

on:
  schedule:
    - cron: '0 11 * * *' # every day at UTC+8 19:00
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore existing gh-pages content
        run: |
          git fetch origin gh-pages || true
          if git branch -r | grep -q 'origin/gh-pages'; then
            mkdir -p docs
            git clone --branch gh-pages --depth 1 . gh-pages-temp || true
            if [ -d gh-pages-temp ]; then
              cp -r gh-pages-temp/* docs/ 2>/dev/null || true
              rm -rf gh-pages-temp
            fi
          fi

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: | 
          uv venv
          uv sync

      - name: Run HF Paper Daily Analysis
        run: |
          uv run python -m scripts.run_hf_paper_daily \
            "${{ secrets.RSS_BASE_URL }}" \
            "${{ secrets.MODEL_API_KEY }}"
          uv run python -m scripts.run_homepage

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/
          publish_branch: gh-pages
          keep_files: true